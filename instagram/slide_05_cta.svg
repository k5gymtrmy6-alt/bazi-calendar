<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
<defs>
  <linearGradient id="bg" x1="0.2" y1="0" x2="0.8" y2="1"><stop offset="0%" stop-color="#07070f"/><stop offset="100%" stop-color="#0a0a14"/></linearGradient>
  <radialGradient id="halo" cx="50%" cy="50%" r="45%"><stop offset="0%" stop-color="#4a7c59" stop-opacity="0.24"/><stop offset="100%" stop-color="#4a7c59" stop-opacity="0"/></radialGradient>
  <linearGradient id="gl" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#4a7c59" stop-opacity="0"/><stop offset="35%" stop-color="#4a7c59"/><stop offset="65%" stop-color="#4a7c59"/><stop offset="100%" stop-color="#4a7c59" stop-opacity="0"/></linearGradient>
  <linearGradient id="ctaBg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#3a6a49"/><stop offset="100%" stop-color="#4a7c59"/></linearGradient>
  <filter id="sg"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <symbol id="logo" viewBox="-80 -80 160 160">
    <polygon points="0,-66 47,-47 66,0 47,47 0,66 -47,47 -66,0 -47,-47" fill="none" stroke="#4a7c59" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="46" fill="none" stroke="#3d3d3d" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="30" fill="#3d3d3d" opacity="0.9"/>
    <path d="M0,-30 A30,30 0 0,1 0,30 A15,15 0 0,1 0,0 A15,15 0 0,0 0,-30 Z" fill="#f0ede8" opacity="0.80"/>
    <path d="M0,-30 A30,30 0 0,0 0,30 A15,15 0 0,0 0,0 A15,15 0 0,1 0,-30 Z" fill="#2C3E2D" opacity="0.85"/>
    <circle cx="0" cy="-15" r="6" fill="#f0ede8" opacity="0.80"/>
    <circle cx="0" cy="15"  r="6" fill="#1a1a1a" opacity="0.85"/>
    <circle cx="0" cy="0"   r="30" fill="none" stroke="#5a5a5a" stroke-width="0.8"/>
    <path d="M0,-30 A15,15 0 0,1 0,0 A15,15 0 0,0 0,30" fill="none" stroke="#5a5a5a" stroke-width="0.8"/>
    <circle cx="40" cy="-40" r="5" fill="#4a7c59"/>
  </symbol>
</defs>

<rect width="1080" height="1080" fill="url(#bg)"/>
<g fill="#fff" opacity="0.55">
  <circle cx="90" cy="90" r="1.2"/><circle cx="300" cy="55" r="0.8"/><circle cx="580" cy="45" r="1.0"/>
  <circle cx="800" cy="70" r="1.3"/><circle cx="1000" cy="60" r="0.9"/>
  <circle cx="55"  cy="380" r="0.8"/><circle cx="1035" cy="340" r="1.1"/>
  <circle cx="60"  cy="720" r="0.9"/><circle cx="1025" cy="690" r="0.8"/>
  <circle cx="100" cy="990" r="1.0"/><circle cx="960"  cy="970" r="0.7"/>
</g>
<g font-family="Georgia,serif" opacity="0.04">
  <text x="20"  y="300" font-size="230" fill="#e8c860" transform="rotate(-11 20 300)">月</text>
  <text x="800" y="800" font-size="210" fill="#4a7c59" transform="rotate(9 800 800)">木</text>
  <text x="350" y="620" font-size="260" fill="#4a7c59" transform="rotate(-3 350 620)">八</text>
</g>

<!-- Logo halo + large logo centered -->
<ellipse cx="540" cy="380" rx="320" ry="320" fill="url(#halo)"/>
<use href="#logo" x="240" y="130" width="600" height="600"/>

<!-- App name large -->
<text x="540" y="800" text-anchor="middle" font-family="Georgia,'Times New Roman',serif"
  font-size="90" font-weight="700" fill="#f0ede8" letter-spacing="3" filter="url(#sg)">Ba-Zi</text>
<text x="540" y="852" text-anchor="middle" font-family="Georgia,serif"
  font-size="34" fill="#e8c860" letter-spacing="9" opacity="0.9">CALENDARIO LUNARE</text>

<!-- Divider -->
<rect x="160" y="876" width="760" height="2" rx="1" fill="url(#gl)" opacity="0.8"/>

<!-- Feature summary pills -->
<g transform="translate(540 920)" text-anchor="middle" font-family="Georgia,serif" font-size="18">
  <g transform="translate(-370 0)"><rect x="-46" y="-18" width="92" height="36" rx="18" fill="#4a7c5920" stroke="#4a7c59" stroke-width="1"/><text y="6" fill="#4a7c59">☯️ Ba-Zi</text></g>
  <g transform="translate(-210 0)"><rect x="-40" y="-18" width="80" height="36" rx="18" fill="#8b691420" stroke="#8b6914" stroke-width="1"/><text y="6" fill="#e8c860">🌙 Luna</text></g>
  <g transform="translate(-60 0)"><rect x="-52" y="-18" width="104" height="36" rx="18" fill="#1a527620" stroke="#1a5276" stroke-width="1"/><text y="6" fill="#9ab0c8">🌱 Agri</text></g>
  <g transform="translate(100 0)"><rect x="-52" y="-18" width="104" height="36" rx="18" fill="#b5451b20" stroke="#b5451b" stroke-width="1"/><text y="6" fill="#d08060">🌅 Routine</text></g>
  <g transform="translate(268 0)"><rect x="-50" y="-18" width="100" height="36" rx="18" fill="#6b728020" stroke="#6b7280" stroke-width="1"/><text y="6" fill="#9a9690">📊 Habit</text></g>
</g>

<!-- Languages -->
<text x="540" y="982" text-anchor="middle" font-family="Georgia,serif"
  font-size="22" fill="#505050" letter-spacing="3">🇮🇹 · 🇬🇧 · 🇪🇸 · PWA · iOS · Android</text>

<!-- CTA button large -->
<rect x="190" y="1010" width="700" height="36" rx="18" fill="#4a7c5922" stroke="#4a7c59" stroke-width="1" stroke-opacity="0.4"/>
<rect x="190" y="1018" width="700" height="54" rx="27" fill="url(#ctaBg)"/>
<text x="540" y="1052" text-anchor="middle" font-family="Georgia,serif"
  font-size="28" font-weight="700" fill="#ffffff" letter-spacing="3">✦ Gratuita — Inizia ora ✦</text>

<!-- Slide dots -->
<g transform="translate(540 1065)" text-anchor="middle">
  <circle cx="-40" cy="0" r="3.5" fill="#fff" opacity="0.25"/>
  <circle cx="-20" cy="0" r="3.5" fill="#fff" opacity="0.25"/>
  <circle cx="0"   cy="0" r="3.5" fill="#fff" opacity="0.25"/>
  <circle cx="20"  cy="0" r="3.5" fill="#fff" opacity="0.25"/>
  <circle cx="40"  cy="0" r="5"   fill="#4a7c59"/>
</g>
</svg>
