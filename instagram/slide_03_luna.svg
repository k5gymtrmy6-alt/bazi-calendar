<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
<defs>
  <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1"><stop offset="0%" stop-color="#06060e"/><stop offset="100%" stop-color="#080814"/></linearGradient>
  <radialGradient id="mhalo" cx="50%" cy="42%" r="38%"><stop offset="0%" stop-color="#e8c860" stop-opacity="0.10"/><stop offset="100%" stop-color="#e8c860" stop-opacity="0"/></radialGradient>
  <radialGradient id="moonGrad" cx="38%" cy="36%" r="65%"><stop offset="0%" stop-color="#fffde8"/><stop offset="100%" stop-color="#e0b840"/></radialGradient>
  <linearGradient id="gl" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#4a7c59" stop-opacity="0"/><stop offset="35%" stop-color="#4a7c59"/><stop offset="65%" stop-color="#4a7c59"/><stop offset="100%" stop-color="#4a7c59" stop-opacity="0"/></linearGradient>
  <filter id="mg"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="sg"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <symbol id="logo-mini" viewBox="-80 -80 160 160">
    <polygon points="0,-66 47,-47 66,0 47,47 0,66 -47,47 -66,0 -47,-47" fill="none" stroke="#4a7c59" stroke-width="2"/>
    <circle cx="0" cy="0" r="30" fill="#3d3d3d" opacity="0.9"/>
    <path d="M0,-30 A30,30 0 0,1 0,30 A15,15 0 0,1 0,0 A15,15 0 0,0 0,-30 Z" fill="#f0ede8" opacity="0.80"/>
    <path d="M0,-30 A30,30 0 0,0 0,30 A15,15 0 0,0 0,0 A15,15 0 0,1 0,-30 Z" fill="#2C3E2D" opacity="0.85"/>
    <circle cx="0" cy="-15" r="6" fill="#f0ede8" opacity="0.80"/>
    <circle cx="0" cy="15"  r="6" fill="#1a1a1a" opacity="0.85"/>
    <circle cx="0" cy="0"   r="30" fill="none" stroke="#5a5a5a" stroke-width="0.8"/>
    <circle cx="40" cy="-40" r="5" fill="#4a7c59"/>
  </symbol>
</defs>

<rect width="1080" height="1080" fill="url(#bg)"/>
<g fill="#fff" opacity="0.5"><circle cx="80" cy="75" r="1.2"/><circle cx="350" cy="50" r="0.8"/><circle cx="620" cy="42" r="1.0"/><circle cx="880" cy="68" r="1.3"/><circle cx="55" cy="380" r="0.9"/><circle cx="1035" cy="340" r="0.8"/><circle cx="60" cy="750" r="1.0"/><circle cx="1020" cy="720" r="0.9"/></g>

<!-- Header -->
<use href="#logo-mini" x="60" y="55" width="80" height="80"/>
<text x="155" y="95" font-family="Georgia,serif" font-size="20" fill="#4a7c59" letter-spacing="2">Ba-Zi Calendario Lunare</text>
<text x="60" y="148" font-family="Georgia,'Times New Roman',serif" font-size="56" font-weight="700" fill="#f0ede8" filter="url(#sg)">Luna &amp; Corpo</text>
<rect x="60" y="165" width="480" height="2" rx="1" fill="url(#gl)"/>
<text x="60" y="205" font-family="Georgia,serif" font-size="24" fill="#9a9690" font-style="italic">Sincronizzati con i cicli lunari</text>

<!-- Moon phases visual strip -->
<ellipse cx="540" cy="380" rx="280" ry="280" fill="url(#mhalo)"/>
<g transform="translate(540 370)">
  <!-- Full moon center -->
  <circle cx="0" cy="0" r="110" fill="url(#moonGrad)" filter="url(#mg)" opacity="0.95"/>
  <!-- crater -->
  <circle cx="-30" cy="-25" r="18" fill="#d4b840" opacity="0.13"/>
  <circle cx="35"  cy="30"  r="13" fill="#d4b840" opacity="0.10"/>
  <!-- Phases around -->
  <!-- Waning G: right -->
  <g transform="translate(220 0)">
    <circle cx="0" cy="0" r="52" fill="#fffde8" opacity="0.12"/>
    <rect x="0" y="-52" width="52" height="104" fill="#07070e"/>
    <circle cx="0" cy="0" r="52" fill="none" stroke="#e8c860" stroke-width="1.5" opacity="0.3"/>
    <text x="0" y="80" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#e8c860" opacity="0.5">Gibbosa</text>
    <text x="0" y="98" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#e8c860" opacity="0.5">Calante</text>
  </g>
  <!-- Last Q: far right -->
  <g transform="translate(380 0)">
    <circle cx="0" cy="0" r="36" fill="#1a1a28" stroke="#e8c860" stroke-width="1.2" stroke-opacity="0.25"/>
    <path d="M0,-36 A36,36 0 0,0 0,36 Z" fill="#fffde8" opacity="0.15"/>
    <text x="0" y="60" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#9a9690" opacity="0.6">Ultimo Q.</text>
  </g>
  <!-- Waxing G: left -->
  <g transform="translate(-220 0)">
    <circle cx="0" cy="0" r="52" fill="#fffde8" opacity="0.18"/>
    <rect x="-52" y="-52" width="52" height="104" fill="#07070e"/>
    <circle cx="0" cy="0" r="52" fill="none" stroke="#e8c860" stroke-width="1.5" opacity="0.3"/>
    <text x="0" y="80" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#e8c860" opacity="0.5">Gibbosa</text>
    <text x="0" y="98" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#e8c860" opacity="0.5">Crescente</text>
  </g>
  <!-- New moon: far left -->
  <g transform="translate(-380 0)">
    <circle cx="0" cy="0" r="36" fill="#1a1a28" stroke="#e8c860" stroke-width="1.2" stroke-opacity="0.25"/>
    <text x="0" y="60" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#9a9690" opacity="0.6">Luna Nuova</text>
  </g>
  <!-- Label -->
  <text x="0" y="140" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#f0ede8" opacity="0.6">Luna Piena</text>
</g>

<!-- 3 benefit blocks -->
<g font-family="Georgia,serif">
  <rect x="60" y="640" width="300" height="200" rx="18" fill="#ffffff08" stroke="#9a9690" stroke-width="1"/>
  <text x="210" y="690" text-anchor="middle" font-size="44">🧬</text>
  <text x="210" y="728" text-anchor="middle" font-size="22" font-weight="700" fill="#f0ede8">Corpo</text>
  <text x="210" y="756" text-anchor="middle" font-size="17" fill="#9a9690">Energia, digiuni,</text>
  <text x="210" y="778" text-anchor="middle" font-size="17" fill="#9a9690">cicatrizzazione,</text>
  <text x="210" y="800" text-anchor="middle" font-size="17" fill="#9a9690">trattamenti ottimali</text>

  <rect x="390" y="640" width="300" height="200" rx="18" fill="#ffffff08" stroke="#e8c860" stroke-width="1" stroke-opacity="0.5"/>
  <text x="540" y="690" text-anchor="middle" font-size="44">💄</text>
  <text x="540" y="728" text-anchor="middle" font-size="22" font-weight="700" fill="#f0ede8">Bellezza</text>
  <text x="540" y="756" text-anchor="middle" font-size="17" fill="#9a9690">Pelle, capelli, unghie</text>
  <text x="540" y="778" text-anchor="middle" font-size="17" fill="#9a9690">Maschere, tagli,</text>
  <text x="540" y="800" text-anchor="middle" font-size="17" fill="#9a9690">trattamenti timing</text>

  <rect x="720" y="640" width="300" height="200" rx="18" fill="#ffffff08" stroke="#4a7c59" stroke-width="1"/>
  <text x="870" y="690" text-anchor="middle" font-size="44">🌱</text>
  <text x="870" y="728" text-anchor="middle" font-size="22" font-weight="700" fill="#f0ede8">Natura</text>
  <text x="870" y="756" text-anchor="middle" font-size="17" fill="#9a9690">Semina, potatura,</text>
  <text x="870" y="778" text-anchor="middle" font-size="17" fill="#9a9690">raccolta, suolo —</text>
  <text x="870" y="800" text-anchor="middle" font-size="17" fill="#9a9690">Maria Thun</text>
</g>

<!-- Insight -->
<rect x="60" y="868" width="960" height="68" rx="16" fill="#e8c86012" stroke="#e8c860" stroke-width="1" stroke-opacity="0.25"/>
<text x="540" y="896" text-anchor="middle" font-family="Georgia,serif" font-size="20" fill="#e8c860" letter-spacing="1">🌕 Luna Piena: emozioni amplificate · evita estrazioni dentali</text>
<text x="540" y="922" text-anchor="middle" font-family="Georgia,serif" font-size="20" fill="#9a9690" letter-spacing="1">🌑 Luna Nuova: ottima per nuovi inizi e digiuni leggeri</text>

<!-- Footer -->
<rect x="0" y="960" width="1080" height="1" fill="url(#gl)" opacity="0.5"/>
<use href="#logo-mini" x="52" y="975" width="60" height="60"/>
<text x="125" y="1008" font-family="Georgia,serif" font-size="17" fill="#4a7c59">Ba-Zi Calendario Lunare</text>
<text x="1020" y="1008" text-anchor="end" font-family="Georgia,serif" font-size="17" fill="#555">3 / 5</text>
<g transform="translate(540 1050)" text-anchor="middle">
  <circle cx="-40" cy="0" r="3.5" fill="#fff" opacity="0.25"/>
  <circle cx="-20" cy="0" r="3.5" fill="#fff" opacity="0.25"/>
  <circle cx="0"   cy="0" r="5"   fill="#4a7c59"/>
  <circle cx="20"  cy="0" r="3.5" fill="#fff" opacity="0.25"/>
  <circle cx="40"  cy="0" r="3.5" fill="#fff" opacity="0.25"/>
</g>
</svg>
