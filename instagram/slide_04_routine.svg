<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0%" stop-color="#07070f"/><stop offset="100%" stop-color="#090912"/></linearGradient>
  <linearGradient id="gl" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#4a7c59" stop-opacity="0"/><stop offset="35%" stop-color="#4a7c59"/><stop offset="65%" stop-color="#4a7c59"/><stop offset="100%" stop-color="#4a7c59" stop-opacity="0"/></linearGradient>
  <filter id="sg"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <symbol id="logo-mini" viewBox="-80 -80 160 160">
    <polygon points="0,-66 47,-47 66,0 47,47 0,66 -47,47 -66,0 -47,-47" fill="none" stroke="#4a7c59" stroke-width="2"/>
    <circle cx="0" cy="0" r="30" fill="#3d3d3d" opacity="0.9"/>
    <path d="M0,-30 A30,30 0 0,1 0,30 A15,15 0 0,1 0,0 A15,15 0 0,0 0,-30 Z" fill="#f0ede8" opacity="0.80"/>
    <path d="M0,-30 A30,30 0 0,0 0,30 A15,15 0 0,0 0,0 A15,15 0 0,1 0,-30 Z" fill="#2C3E2D" opacity="0.85"/>
    <circle cx="0" cy="-15" r="6" fill="#f0ede8" opacity="0.80"/>
    <circle cx="0" cy="15"  r="6" fill="#1a1a1a" opacity="0.85"/>
    <circle cx="0" cy="0"   r="30" fill="none" stroke="#5a5a5a" stroke-width="0.8"/>
    <circle cx="40" cy="-40" r="5" fill="#4a7c59"/>
  </symbol>
</defs>

<rect width="1080" height="1080" fill="url(#bg)"/>
<g fill="#fff" opacity="0.45"><circle cx="80" cy="75" r="1.1"/><circle cx="900" cy="55" r="0.9"/><circle cx="55" cy="500" r="0.8"/><circle cx="1030" cy="470" r="1.0"/><circle cx="130" cy="950" r="0.9"/></g>
<g font-family="Georgia,serif" opacity="0.04">
  <text x="750" y="400" font-size="210" fill="#4a7c59" transform="rotate(8 750 400)">木</text>
  <text x="20" y="700" font-size="190" fill="#e8c860" transform="rotate(-10 20 700)">日</text>
</g>

<!-- Header -->
<use href="#logo-mini" x="60" y="55" width="80" height="80"/>
<text x="155" y="95" font-family="Georgia,serif" font-size="20" fill="#4a7c59" letter-spacing="2">Ba-Zi Calendario Lunare</text>
<text x="60" y="148" font-family="Georgia,'Times New Roman',serif" font-size="52" font-weight="700" fill="#f0ede8" filter="url(#sg)">Routine &amp; Abitudini</text>
<rect x="60" y="165" width="560" height="2" rx="1" fill="url(#gl)"/>
<text x="60" y="205" font-family="Georgia,serif" font-size="24" fill="#9a9690" font-style="italic">Costruisci la tua versione migliore ogni giorno</text>

<!-- LEFT column: Morning Routine mock -->
<g font-family="Georgia,serif">
  <text x="60" y="268" font-size="22" font-weight="600" fill="#e8c860" letter-spacing="2">🌅 MORNING ROUTINE</text>

  <!-- Task cards -->
  <g transform="translate(60 285)">
    <!-- done -->
    <rect x="0" y="0"   width="450" height="62" rx="12" fill="#4a7c5918" stroke="#4a7c59" stroke-width="1"/>
    <circle cx="30" cy="31" r="14" fill="#4a7c59"/>
    <text x="30" y="36" text-anchor="middle" font-size="15" fill="#fff">✓</text>
    <text x="60" y="25" font-size="20" font-weight="500" fill="#9a9690" text-decoration="line-through">Meditazione</text>
    <text x="60" y="47" font-size="16" fill="#555">10 min</text>
    <text x="430" y="36" text-anchor="end" font-size="15" fill="#4a7c59">✓</text>

    <!-- done -->
    <rect x="0" y="72"  width="450" height="62" rx="12" fill="#4a7c5918" stroke="#4a7c59" stroke-width="1"/>
    <circle cx="30" cy="103" r="14" fill="#4a7c59"/>
    <text x="30" y="108" text-anchor="middle" font-size="15" fill="#fff">✓</text>
    <text x="60" y="97" font-size="20" font-weight="500" fill="#9a9690" text-decoration="line-through">Plank</text>
    <text x="60" y="119" font-size="16" fill="#555">3 ripetizioni</text>

    <!-- active -->
    <rect x="0" y="144" width="450" height="62" rx="12" fill="#b5451b18" stroke="#b5451b" stroke-width="1.5"/>
    <circle cx="30" cy="175" r="14" fill="none" stroke="#b5451b" stroke-width="2"/>
    <text x="60" y="169" font-size="20" font-weight="600" fill="#f0ede8">Stretching</text>
    <text x="60" y="191" font-size="16" fill="#9a9690">10 min · in corso…</text>
    <text x="430" y="181" text-anchor="end" font-size="22">⏱</text>

    <!-- inactive -->
    <rect x="0" y="216" width="450" height="62" rx="12" fill="#ffffff08" stroke="#3a3a3a" stroke-width="1"/>
    <circle cx="30" cy="247" r="14" fill="none" stroke="#444" stroke-width="1.5"/>
    <text x="60" y="241" font-size="20" fill="#555">Acqua tiepida</text>
    <text x="60" y="263" font-size="16" fill="#444">2 min</text>

    <!-- Progress bar -->
    <rect x="0" y="294" width="450" height="10" rx="5" fill="#1a1a1a"/>
    <rect x="0" y="294" width="270" height="10" rx="5" fill="#4a7c59"/>
    <text x="0"   y="322" font-size="17" fill="#4a7c59">3 / 5 completate</text>
    <text x="450" y="322" text-anchor="end" font-size="17" fill="#9a9690">60%</text>
  </g>
</g>

<!-- Vertical divider -->
<rect x="570" y="240" width="1" height="620" fill="#4a7c59" opacity="0.25"/>

<!-- RIGHT column: Habit tracker mock -->
<g font-family="Georgia,serif" transform="translate(600 0)">
  <text x="0" y="268" font-size="22" font-weight="600" fill="#e8c860" letter-spacing="2">📊 TRACKER ABITUDINI</text>

  <!-- Habits with mini progress rings -->
  <g transform="translate(0 290)">
    <!-- Acqua -->
    <rect x="0" y="0" width="440" height="72" rx="14" fill="#1a527618" stroke="#1a5276" stroke-width="1"/>
    <circle cx="36" cy="36" r="22" fill="none" stroke="#1a527644" stroke-width="5"/>
    <path d="M36,14 A22,22 0 1,1 35.99,14" fill="none" stroke="#1a5276" stroke-width="5" stroke-linecap="round" stroke-dasharray="120,138" transform="rotate(-90 36 36)"/>
    <text x="36" y="42" text-anchor="middle" font-size="14" fill="#1a5276" font-weight="600">2.1L</text>
    <text x="75" y="27" font-size="20" font-weight="600" fill="#f0ede8">Acqua</text>
    <text x="75" y="51" font-size="16" fill="#1a5276">2.1 / 2.5 L oggi</text>
    <rect x="370" y="30" width="60" height="14" rx="7" fill="#1a527644"/>
    <rect x="370" y="30" width="48" height="14" rx="7" fill="#1a5276"/>

    <!-- Sonno -->
    <rect x="0" y="82" width="440" height="72" rx="14" fill="#4a7c5918" stroke="#4a7c59" stroke-width="1"/>
    <circle cx="36" cy="118" r="22" fill="none" stroke="#4a7c5944" stroke-width="5"/>
    <path d="M36,96 A22,22 0 1,1 35.99,96" fill="none" stroke="#4a7c59" stroke-width="5" stroke-linecap="round" stroke-dasharray="131,138" transform="rotate(-90 36 118)"/>
    <text x="36" y="124" text-anchor="middle" font-size="14" fill="#4a7c59" font-weight="600">7.5h</text>
    <text x="75" y="109" font-size="20" font-weight="600" fill="#f0ede8">Sonno</text>
    <text x="75" y="133" font-size="16" fill="#4a7c59">7.5 / 8 ore</text>

    <!-- No fumo streak -->
    <rect x="0" y="164" width="440" height="72" rx="14" fill="#8b691418" stroke="#8b6914" stroke-width="1"/>
    <text x="36" y="210" text-anchor="middle" font-size="34">🔥</text>
    <text x="75" y="191" font-size="20" font-weight="600" fill="#f0ede8">No fumo</text>
    <text x="75" y="215" font-size="16" fill="#8b6914">47 giorni di fila · 🏆 record</text>

    <!-- Lettura -->
    <rect x="0" y="246" width="440" height="72" rx="14" fill="#b5451b18" stroke="#b5451b" stroke-width="1"/>
    <circle cx="36" cy="282" r="22" fill="none" stroke="#b5451b44" stroke-width="5"/>
    <path d="M36,260 A22,22 0 0,1 58,282" fill="none" stroke="#b5451b" stroke-width="5" stroke-linecap="round"/>
    <text x="36" y="288" text-anchor="middle" font-size="14" fill="#b5451b" font-weight="600">20'</text>
    <text x="75" y="273" font-size="20" font-weight="600" fill="#f0ede8">Lettura</text>
    <text x="75" y="297" font-size="16" fill="#b5451b">20 / 30 min</text>
  </g>

  <!-- Weekly streak visual -->
  <text x="0" y="660" font-size="18" fill="#e8c860" letter-spacing="1">Streak settimanale</text>
  <g transform="translate(0 672)">
    <text x="0"   y="0" font-family="system-ui" font-size="24">✅</text><text x="0"   y="26" text-anchor="start" font-size="12" fill="#555">Lun</text>
    <text x="52"  y="0" font-family="system-ui" font-size="24">✅</text><text x="52"  y="26" text-anchor="start" font-size="12" fill="#555">Mar</text>
    <text x="104" y="0" font-family="system-ui" font-size="24">✅</text><text x="104" y="26" text-anchor="start" font-size="12" fill="#555">Mer</text>
    <text x="156" y="0" font-family="system-ui" font-size="24">✅</text><text x="156" y="26" text-anchor="start" font-size="12" fill="#555">Gio</text>
    <text x="208" y="0" font-family="system-ui" font-size="24">✅</text><text x="208" y="26" text-anchor="start" font-size="12" fill="#555">Ven</text>
    <circle cx="272" cy="-6" r="12" fill="none" stroke="#333" stroke-width="2"/><text x="272" y="26" text-anchor="middle" font-size="12" fill="#555">Sab</text>
    <circle cx="322" cy="-6" r="12" fill="none" stroke="#333" stroke-width="2"/><text x="322" y="26" text-anchor="middle" font-size="12" fill="#555">Dom</text>
  </g>
</g>

<!-- Footer -->
<rect x="0" y="960" width="1080" height="1" fill="url(#gl)" opacity="0.5"/>
<use href="#logo-mini" x="52" y="975" width="60" height="60"/>
<text x="125" y="1008" font-family="Georgia,serif" font-size="17" fill="#4a7c59">Ba-Zi Calendario Lunare</text>
<text x="1020" y="1008" text-anchor="end" font-family="Georgia,serif" font-size="17" fill="#555">4 / 5</text>
<g transform="translate(540 1050)" text-anchor="middle">
  <circle cx="-40" cy="0" r="3.5" fill="#fff" opacity="0.25"/>
  <circle cx="-20" cy="0" r="3.5" fill="#fff" opacity="0.25"/>
  <circle cx="0"   cy="0" r="3.5" fill="#fff" opacity="0.25"/>
  <circle cx="20"  cy="0" r="5"   fill="#4a7c59"/>
  <circle cx="40"  cy="0" r="3.5" fill="#fff" opacity="0.25"/>
</g>
</svg>
