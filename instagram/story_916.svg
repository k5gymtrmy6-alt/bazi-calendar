<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#06060e"/>
      <stop offset="40%" stop-color="#08081a"/>
      <stop offset="100%" stop-color="#060612"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fff8e8" stop-opacity="1"/>
      <stop offset="45%"  stop-color="#ffeebb" stop-opacity="0.9"/>
      <stop offset="75%"  stop-color="#e8c870" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a07820" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#4a7c59" stop-opacity="0"/>
      <stop offset="55%"  stop-color="#4a7c59" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#2a5c39" stop-opacity="0.18"/>
    </radialGradient>
    <radialGradient id="moonBodyGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fffde8"/>
      <stop offset="100%" stop-color="#e8c850"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#4a7c59" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#4a7c59" stop-opacity="0.8"/>
      <stop offset="70%"  stop-color="#4a7c59" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4a7c59" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#e8c860" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#e8c860" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#e8c860" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <clipPath id="taijiClip"><circle cx="0" cy="0" r="70"/></clipPath>
  </defs>

  <!-- ── Background ── -->
  <rect width="1080" height="1920" fill="url(#bg)"/>

  <!-- ── Starfield ── -->
  <g opacity="0.7" fill="#ffffff">
    <circle cx="82"  cy="104" r="1.2"/><circle cx="240" cy="65"  r="0.8"/>
    <circle cx="380" cy="138" r="1.5"/><circle cx="520" cy="42"  r="0.9"/>
    <circle cx="680" cy="90"  r="1.1"/><circle cx="820" cy="158" r="0.7"/>
    <circle cx="940" cy="72"  r="1.3"/><circle cx="1010" cy="130" r="0.9"/>
    <circle cx="150" cy="290" r="0.7"/><circle cx="960" cy="280" r="1.1"/>
    <circle cx="60"  cy="480" r="0.8"/><circle cx="1020" cy="420" r="0.9"/>
    <circle cx="200" cy="520" r="1.0"/><circle cx="880" cy="500" r="0.7"/>
    <circle cx="320" cy="680" r="0.6"/><circle cx="760" cy="640" r="1.2"/>
    <circle cx="440" cy="740" r="0.8"/><circle cx="920" cy="700" r="0.9"/>
    <circle cx="100" cy="820" r="1.1"/><circle cx="1000" cy="780" r="0.7"/>
  </g>

  <!-- ── Faint background Chinese chars ── -->
  <g font-family="Georgia, serif" fill="#e8c860" opacity="0.04">
    <text x="30"  y="240" font-size="220" transform="rotate(-12 30 240)">月</text>
    <text x="800" y="420" font-size="200" transform="rotate(8 800 420)">木</text>
    <text x="60"  y="700" font-size="180" transform="rotate(-6 60 700)">水</text>
    <text x="850" y="820" font-size="160" transform="rotate(14 850 820)">火</text>
    <text x="20"  y="1100" font-size="200" transform="rotate(-10 20 1100)">土</text>
    <text x="840" y="1150" font-size="180" transform="rotate(6 840 1150)">金</text>
    <text x="80"  y="1450" font-size="160" transform="rotate(-8 80 1450)">天</text>
    <text x="870" y="1480" font-size="170" transform="rotate(10 870 1480)">地</text>
  </g>
  <g font-family="Georgia, serif" fill="#4a7c59" opacity="0.05">
    <text x="420" y="1050" font-size="240" transform="rotate(0 420 1050)">八</text>
    <text x="380" y="1700" font-size="190" transform="rotate(-5 380 1700)">字</text>
  </g>

  <!-- ── Moon halo ── -->
  <ellipse cx="540" cy="420" rx="380" ry="380" fill="url(#halo)"/>

  <!-- ── Moon glow outer ring ── -->
  <circle cx="540" cy="420" r="280" fill="none" stroke="#e8c860" stroke-width="1" opacity="0.12"/>
  <circle cx="540" cy="420" r="240" fill="none" stroke="#e8c860" stroke-width="0.5" opacity="0.08"/>

  <!-- ── Full moon ── -->
  <circle cx="540" cy="420" r="190" fill="url(#moonBodyGrad)" filter="url(#glow)" opacity="0.96"/>

  <!-- Moon surface texture - subtle craters -->
  <circle cx="490" cy="380" r="28" fill="#d4b840" opacity="0.15"/>
  <circle cx="580" cy="460" r="20" fill="#d4b840" opacity="0.10"/>
  <circle cx="520" cy="490" r="14" fill="#d4b840" opacity="0.12"/>
  <circle cx="600" cy="370" r="18" fill="#d4b840" opacity="0.09"/>
  <circle cx="460" cy="440" r="10" fill="#d4b840" opacity="0.08"/>

  <!-- ── Phases strip ── -->
  <g transform="translate(540 680)" opacity="0.75">
    <!-- Waning crescent -->
    <g transform="translate(-440 0)">
      <circle cx="0" cy="0" r="32" fill="#fffde8" opacity="0.15"/>
      <circle cx="16" cy="0" r="32" fill="#08081a"/>
      <circle cx="0" cy="0" r="32" fill="none" stroke="#e8c860" stroke-width="1.5" opacity="0.4"/>
    </g>
    <!-- Last quarter -->
    <g transform="translate(-220 0)">
      <circle cx="0" cy="0" r="32" fill="#fffde8" opacity="0.2"/>
      <rect x="0" y="-32" width="32" height="64" fill="#08081a"/>
      <circle cx="0" cy="0" r="32" fill="none" stroke="#e8c860" stroke-width="1.5" opacity="0.4"/>
    </g>
    <!-- New moon (dark) -->
    <circle cx="0" cy="0" r="32" fill="#1a1a28" stroke="#e8c860" stroke-width="1.5" opacity="1"/>
    <!-- First quarter -->
    <g transform="translate(220 0)">
      <circle cx="0" cy="0" r="32" fill="#1a1a28" opacity="1"/>
      <path d="M0,-32 A32,32 0 0,1 0,32 Z" fill="#fffde8" opacity="0.85"/>
      <circle cx="0" cy="0" r="32" fill="none" stroke="#e8c860" stroke-width="1.5" opacity="0.4"/>
    </g>
    <!-- Full moon -->
    <circle cx="440" cy="0" r="32" fill="#fffde8" filter="url(#softGlow)" opacity="0.9"/>
  </g>

  <!-- ── Decorative line ── -->
  <rect x="0" y="760" width="1080" height="1" fill="url(#goldLine)"/>

  <!-- ── App name section ── -->
  <g transform="translate(540 860)" text-anchor="middle">
    <!-- Taijitu (yin-yang) -->
    <g transform="translate(0 -30)">
      <circle cx="0" cy="0" r="40" fill="#0d0d20"/>
      <path d="M0,-40 A40,40 0 0,0 0,40 A20,20 0 0,1 0,0 A20,20 0 0,0 0,-40 Z" fill="#fffde8"/>
      <circle cx="0" cy="-20" r="10" fill="#0d0d20"/>
      <circle cx="0" cy="20" r="10" fill="#fffde8"/>
      <circle cx="0" cy="0" r="40" fill="none" stroke="#e8c860" stroke-width="1.5" opacity="0.6"/>
      <!-- Green brand dot -->
      <circle cx="28" cy="-28" r="6" fill="#4a7c59"/>
    </g>

    <!-- Title -->
    <text y="50" font-family="Georgia, 'Times New Roman', serif" font-size="80" font-weight="700"
      fill="#fffde8" letter-spacing="4" filter="url(#softGlow)">Ba-Zi</text>
    <text y="130" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="400"
      fill="#e8c860" letter-spacing="8" opacity="0.9">CALENDARIO LUNARE</text>

    <!-- Green accent line -->
    <rect x="-200" y="155" width="400" height="2" fill="url(#lineGrad)" rx="1"/>

    <!-- Tagline -->
    <text y="210" font-family="Georgia, serif" font-size="32" fill="#a0b8a8" letter-spacing="2"
      font-style="italic">Il tuo compagno cosmico quotidiano</text>
  </g>

  <!-- ── Features cards ── -->
  <g transform="translate(60 1140)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="460" height="130" rx="20" fill="url(#cardBg)" stroke="#4a7c59" stroke-width="1" stroke-opacity="0.3"/>
    <text x="30" y="45" font-family="system-ui, sans-serif" font-size="36">🌙</text>
    <text x="85" y="42" font-family="Georgia, serif" font-size="26" font-weight="600" fill="#fffde8">Fasi Lunari</text>
    <text x="85" y="72" font-family="Georgia, serif" font-size="20" fill="#a0a090">Orari precisi, consigli per corpo</text>
    <text x="85" y="96" font-family="Georgia, serif" font-size="20" fill="#a0a090">bellezza e agricoltura biodinamica</text>

    <!-- Card 2 -->
    <rect x="500" y="0" width="460" height="130" rx="20" fill="url(#cardBg)" stroke="#8b6914" stroke-width="1" stroke-opacity="0.4"/>
    <text x="530" y="45" font-family="system-ui, sans-serif" font-size="36">☯️</text>
    <text x="585" y="42" font-family="Georgia, serif" font-size="26" font-weight="600" fill="#fffde8">Ba-Zi</text>
    <text x="585" y="72" font-family="Georgia, serif" font-size="20" fill="#a0a090">Quattro Pilastri calcolati con</text>
    <text x="585" y="96" font-family="Georgia, serif" font-size="20" fill="#a0a090">24 Jieqi astronomici precisi</text>

    <!-- Card 3 -->
    <rect x="0" y="155" width="460" height="130" rx="20" fill="url(#cardBg)" stroke="#1a5276" stroke-width="1" stroke-opacity="0.4"/>
    <text x="30" y="200" font-family="system-ui, sans-serif" font-size="36">🌱</text>
    <text x="85" y="197" font-family="Georgia, serif" font-size="26" font-weight="600" fill="#fffde8">Agricoltura</text>
    <text x="85" y="227" font-family="Georgia, serif" font-size="20" fill="#a0a090">Semina, potatura e raccolta</text>
    <text x="85" y="251" font-family="Georgia, serif" font-size="20" fill="#a0a090">con il sistema Maria Thun</text>

    <!-- Card 4 -->
    <rect x="500" y="155" width="460" height="130" rx="20" fill="url(#cardBg)" stroke="#b5451b" stroke-width="1" stroke-opacity="0.3"/>
    <text x="530" y="200" font-family="system-ui, sans-serif" font-size="36">🛠️</text>
    <text x="585" y="197" font-family="Georgia, serif" font-size="26" font-weight="600" fill="#fffde8">Utility</text>
    <text x="585" y="227" font-family="Georgia, serif" font-size="20" fill="#a0a090">Routine, abitudini, to-do</text>
    <text x="585" y="251" font-family="Georgia, serif" font-size="20" fill="#a0a090">e note sincronizzate</text>
  </g>

  <!-- ── Green divider line ── -->
  <rect x="0" y="1480" width="1080" height="1.5" fill="url(#lineGrad)"/>

  <!-- ── Chinese chars strip ── -->
  <g transform="translate(540 1540)" text-anchor="middle" font-family="Georgia, serif">
    <text font-size="38" fill="#e8c860" opacity="0.6" letter-spacing="22">甲 乙 丙 丁 戊 己 庚 辛 壬 癸</text>
    <text y="52" font-size="28" fill="#4a7c59" opacity="0.5" letter-spacing="26">子 丑 寅 卯 辰 巳 午 未 申 酉 戌 亥</text>
  </g>

  <!-- ── Languages & platform ── -->
  <g transform="translate(540 1670)" text-anchor="middle">
    <text font-family="Georgia, serif" font-size="28" fill="#a0a090" letter-spacing="4">🇮🇹 Italiano  ·  🇬🇧 English  ·  🇪🇸 Español</text>
    <text y="48" font-family="Georgia, serif" font-size="24" fill="#606060" letter-spacing="3">PWA  ·  iOS &amp; Android  ·  Gratuita</text>
  </g>

  <!-- ── Bottom CTA ── -->
  <g transform="translate(540 1790)" text-anchor="middle">
    <rect x="-220" y="-40" width="440" height="72" rx="36" fill="#4a7c59" opacity="0.9"/>
    <text font-family="Georgia, serif" font-size="30" font-weight="700" fill="#ffffff" letter-spacing="2">✦ Scopri l'app ✦</text>
  </g>

  <!-- ── Brand signature ── -->
  <text x="540" y="1900" text-anchor="middle" font-family="Georgia, serif" font-size="22"
    fill="#404040" letter-spacing="4">BA-ZI CALENDARIO LUNARE</text>
</svg>
