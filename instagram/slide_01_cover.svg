<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0.5" y2="1"><stop offset="0%" stop-color="#07070f"/><stop offset="100%" stop-color="#0c0c18"/></linearGradient>
  <radialGradient id="halo" cx="50%" cy="46%" r="45%"><stop offset="0%" stop-color="#4a7c59" stop-opacity="0.22"/><stop offset="100%" stop-color="#4a7c59" stop-opacity="0"/></radialGradient>
  <filter id="sg"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <linearGradient id="gl" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#4a7c59" stop-opacity="0"/><stop offset="35%" stop-color="#4a7c59"/><stop offset="65%" stop-color="#4a7c59"/><stop offset="100%" stop-color="#4a7c59" stop-opacity="0"/></linearGradient>
  <symbol id="logo" viewBox="-80 -80 160 160">
    <polygon points="0,-66 47,-47 66,0 47,47 0,66 -47,47 -66,0 -47,-47" fill="none" stroke="#4a7c59" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="46" fill="none" stroke="#3d3d3d" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="30" fill="#3d3d3d" opacity="0.9"/>
    <path d="M0,-30 A30,30 0 0,1 0,30 A15,15 0 0,1 0,0 A15,15 0 0,0 0,-30 Z" fill="#f0ede8" opacity="0.80"/>
    <path d="M0,-30 A30,30 0 0,0 0,30 A15,15 0 0,0 0,0 A15,15 0 0,1 0,-30 Z" fill="#2C3E2D" opacity="0.85"/>
    <circle cx="0" cy="-15" r="6" fill="#f0ede8" opacity="0.80"/>
    <circle cx="0" cy="15"  r="6" fill="#1a1a1a" opacity="0.85"/>
    <circle cx="0" cy="0"   r="30" fill="none" stroke="#5a5a5a" stroke-width="0.8"/>
    <path d="M0,-30 A15,15 0 0,1 0,0 A15,15 0 0,0 0,30" fill="none" stroke="#5a5a5a" stroke-width="0.8"/>
    <circle cx="40" cy="-40" r="5" fill="#4a7c59"/>
  </symbol>
</defs>

<rect width="1080" height="1080" fill="url(#bg)"/>
<g fill="#fff" opacity="0.5">
  <circle cx="90" cy="90" r="1.2"/><circle cx="280" cy="60" r="0.9"/><circle cx="500" cy="40" r="1.1"/>
  <circle cx="720" cy="75" r="0.8"/><circle cx="920" cy="55" r="1.3"/><circle cx="55" cy="350" r="0.9"/>
  <circle cx="1040" cy="300" r="1.0"/><circle cx="60" cy="700" r="0.8"/><circle cx="1030" cy="680" r="1.1"/>
  <circle cx="120" cy="980" r="0.9"/><circle cx="960" cy="960" r="0.7"/>
</g>
<g font-family="Georgia,serif" opacity="0.035">
  <text x="-10" y="280" font-size="230" fill="#e8c860" transform="rotate(-12 -10 280)">月</text>
  <text x="820" y="860" font-size="210" fill="#4a7c59" transform="rotate(10 820 860)">木</text>
</g>

<ellipse cx="540" cy="430" rx="320" ry="320" fill="url(#halo)"/>
<use href="#logo" x="240" y="130" width="600" height="600"/>

<g text-anchor="middle" font-family="Georgia,'Times New Roman',serif">
  <text x="540" y="800" font-size="80" font-weight="700" fill="#f0ede8" letter-spacing="3" filter="url(#sg)">Ba-Zi</text>
  <text x="540" y="848" font-size="32" fill="#e8c860" letter-spacing="8" opacity="0.9">CALENDARIO LUNARE</text>
  <rect x="240" y="870" width="600" height="2" rx="1" fill="url(#gl)" opacity="0.8"/>
  <text x="540" y="920" font-size="28" fill="#9a9690" font-style="italic">La tua guida per la crescita personale</text>
</g>

<!-- Swipe indicator -->
<g transform="translate(540 990)" text-anchor="middle">
  <text font-family="Georgia,serif" font-size="18" fill="#4a7c59" opacity="0.7" letter-spacing="2">scorri per scoprire →</text>
</g>

<!-- Slide dots -->
<g transform="translate(540 1048)" text-anchor="middle">
  <circle cx="-40" cy="0" r="5" fill="#4a7c59"/>
  <circle cx="-20" cy="0" r="3.5" fill="#fff" opacity="0.25"/>
  <circle cx="0"   cy="0" r="3.5" fill="#fff" opacity="0.25"/>
  <circle cx="20"  cy="0" r="3.5" fill="#fff" opacity="0.25"/>
  <circle cx="40"  cy="0" r="3.5" fill="#fff" opacity="0.25"/>
</g>
</svg>
